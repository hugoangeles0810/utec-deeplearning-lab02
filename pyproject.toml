[project]
name = "clamf"
version = "0.1.0"
description = "CLAMF-Former implementation for Deep Learning Lab 2 (UTEC)"
authors = [
    { name = "Hugo Angeles", email = "hugoangeles0810@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
