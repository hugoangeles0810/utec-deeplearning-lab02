[project]
name = "clamf"
version = "0.1.0"
description = "CLAMF-Former implementation for Deep Learning Lab 2 (UTEC)"
authors = [
    { name = "Hugo Angeles", email = "hugoangeles0810@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "torch>=2.14.0",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
